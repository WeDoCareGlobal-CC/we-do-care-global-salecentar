version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: salecentar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salecentar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-salecentar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salecentar} -d ${POSTGRES_DB:-salecentar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - salecentar-network

  salecentar-integration:
    build:
      context: ./apps/salecentar/integration
      dockerfile: Dockerfile
    container_name: salecentar-integration
    environment:
      SALECENTAR_DATABASE_URL: postgres://${POSTGRES_USER:-salecentar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salecentar}
      SALECENTAR_MENU_SNAP_SECRET: ${SALECENTAR_MENU_SNAP_SECRET}
      SALECENTAR_ZERO_BUDGET_SECRET: ${SALECENTAR_ZERO_BUDGET_SECRET}
      SALECENTAR_MUSE_FLOW_SECRET: ${SALECENTAR_MUSE_FLOW_SECRET}
      SALECENTAR_HERMES_SECRET: ${SALECENTAR_HERMES_SECRET}
      SALECENTAR_ADMIN_TOKEN: ${SALECENTAR_ADMIN_TOKEN}
      SALECENTAR_BOOTSTRAP_SECRET: ${SALECENTAR_BOOTSTRAP_SECRET}
      SALECENTAR_SPEECH_GENERATOR_SECRET: ${SALECENTAR_SPEECH_GENERATOR_SECRET}
      SALECENTAR_PORT: 3101
      SALECENTAR_HOST: 0.0.0.0
      SPEECH_DAILY_LIMIT: ${SPEECH_DAILY_LIMIT:-20}
      NODE_ENV: production
    ports:
      - "3101:3101"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - salecentar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  menu-snap:
    build:
      context: ./apps/menu-snap
      dockerfile: Dockerfile
    container_name: menu-snap
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-salecentar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salecentar}
      SALECENTAR_AUTH_URL: http://salecentar-integration:3101
      SALECENTAR_MENU_SNAP_SECRET: ${SALECENTAR_MENU_SNAP_SECRET}
      SALECENTAR_SYNC_URL: http://salecentar-integration:3101/sync/menu-snap
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      salecentar-integration:
        condition: service_healthy
    networks:
      - salecentar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  zerobudget-ai:
    build:
      context: ./apps/zerobudget-ai
      dockerfile: Dockerfile
    container_name: zerobudget-ai
    environment:
      SALECENTAR_AUTH_URL: http://salecentar-integration:3101
      SALECENTAR_ZERO_BUDGET_SECRET: ${SALECENTAR_ZERO_BUDGET_SECRET}
      SALECENTAR_SYNC_URL: http://salecentar-integration:3101/sync/zerobudget-ai
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ZERO_BUDGET_AI_TOKEN: ${ZERO_BUDGET_AI_TOKEN}
      ZERO_BUDGET_AI_DAILY_LIMIT: ${ZERO_BUDGET_AI_DAILY_LIMIT:-20}
      ZERO_BUDGET_PACK_PRICE_CENTS: ${ZERO_BUDGET_PACK_PRICE_CENTS:-2900}
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      salecentar-integration:
        condition: service_healthy
    networks:
      - salecentar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  muse-flow:
    build:
      context: ./apps/muse-flow
      dockerfile: Dockerfile
    container_name: muse-flow
    environment:
      SALECENTAR_AUTH_URL: http://salecentar-integration:3101
      SALECENTAR_MUSE_FLOW_SECRET: ${SALECENTAR_MUSE_FLOW_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SPEECH_GENERATOR_URL: http://speech-generator:3013
      NODE_ENV: production
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      salecentar-integration:
        condition: service_healthy
      speech-generator:
        condition: service_healthy
    networks:
      - salecentar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  speech-generator:
    build:
      context: ./apps/speech-generator
      dockerfile: Dockerfile
    container_name: speech-generator
    environment:
      SALECENTAR_AUTH_URL: http://salecentar-integration:3101
      SALECENTAR_SPEECH_GENERATOR_SECRET: ${SALECENTAR_SPEECH_GENERATOR_SECRET}
      SPEECH_PROVIDER_URL: ${SPEECH_PROVIDER_URL}
      SPEECH_PROVIDER_API_KEY: ${SPEECH_PROVIDER_API_KEY}
      NODE_ENV: production
      PORT: 3013
    ports:
      - "3013:3013"
    depends_on:
      salecentar-integration:
        condition: service_healthy
    networks:
      - salecentar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3013/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  hermes-x402:
    build:
      context: ./apps/hermes-x402
      dockerfile: Dockerfile
    container_name: hermes-x402
    environment:
      X402_NETWORK: ${X402_NETWORK:-base-sepolia}
      X402_SETTLE_MODE: simulate
      X402_PRIVATE_KEY: ${X402_PRIVATE_KEY}
      X402_HOST: 0.0.0.0
      X402_LEDGER_DB: /data/x402_profit.db
      HERMES_ADMIN_API_KEY: ${HERMES_ADMIN_API_KEY}
      X402_ALLOW_PUBLIC_SIMULATION: "false"
      SALECENTAR_HERMES_SECRET: ${SALECENTAR_HERMES_SECRET}
      SALECENTAR_SYNC_URL: http://salecentar-integration:3101/sync/hermes
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - hermes_data:/data
    depends_on:
      salecentar-integration:
        condition: service_healthy
    networks:
      - salecentar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: salecentar-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - salecentar-integration
      - menu-snap
      - zerobudget-ai
      - muse-flow
      - speech-generator
      - hermes-x402
    networks:
      - salecentar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  hermes_data:

networks:
  salecentar-network:
    driver: bridge