events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none';";

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    upstream salecentar_integration {
        server salecentar-integration:3101;
    }

    upstream menu_snap {
        server menu-snap:3000;
    }

    upstream zerobudget_ai {
        server zerobudget-ai:3001;
    }

    upstream muse_flow {
        server muse-flow:3002;
    }

    upstream speech_generator {
        server speech-generator:3013;
    }

    upstream hermes_x402 {
        server hermes-x402:8000;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name salecentar.local;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name salecentar.local;

        ssl_certificate /etc/nginx/ssl/salecentar.crt;
        ssl_certificate_key /etc/nginx/ssl/salecentar.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # SaleCentar Integration API
        location /integration/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://salecentar_integration/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Portal (staff only)
        location /portal {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://salecentar_integration;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin/Control panel
        location /control {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://salecentar_integration;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check (no rate limit)
        location /health {
            proxy_pass http://salecentar_integration;
            proxy_set_header Host $host;
        }

        # Menu Snap
        location /menu-snap/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://menu_snap/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ZeroBudget AI
        location /zerobudget-ai/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://zerobudget_ai/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Muse-Flow
        location /muse-flow/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://muse_flow/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Speech Generator
        location /speech/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://speech_generator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Hermes x402
        location /hermes/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://hermes_x402/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth endpoints - stricter rate limiting
        location ~ ^/(auth|api/auth) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://salecentar_integration;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default fallback
        location / {
            proxy_pass http://salecentar_integration;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}