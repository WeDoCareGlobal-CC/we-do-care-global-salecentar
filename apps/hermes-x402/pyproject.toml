[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-x402-profit"
version = "1.0.0"
description = "x402 payment rail with profit accounting, built from the protocol spec"
requires-python = ">=3.11"
dependencies = [
    "ecdsa>=0.19",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.setuptools]
packages = ["hermes_x402"]
